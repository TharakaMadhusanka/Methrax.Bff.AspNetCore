<div class="min-h-screen bg-gray-50 flex flex-col">

  <header class="py-6 border-b bg-white shadow-sm">
    <h1 class="text-2xl font-bold text-center text-gray-800">
      Backend-for-Frontend Dashboard
    </h1>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">

    <ng-container *ngIf="authService.user$ | async as user; else loading">

      <div class="w-full max-w-lg bg-white rounded-2xl shadow-md p-8 space-y-6">

        <div class="text-center space-y-1">
          <h2 class="text-xl font-semibold text-gray-800">
            Welcome back, {{ user?.name }}
          </h2>
          <p class="text-sm text-gray-500">
            {{ user?.email }}
          </p>
        </div>

        <div>
          <h3 class="text-sm font-semibold text-gray-600 mb-2">
            Assigned Roles
          </h3>

          <div class="flex flex-wrap gap-2">
            @for (role of user?.roles; track $index) {
              <span class="px-3 py-1 text-xs font-medium bg-blue-100 text-blue-700 rounded-full">
                {{ role }}
              </span>
            }
          </div>
        </div>

      </div>

    </ng-container>

    <ng-template #loading>
      <div class="flex flex-col items-center space-y-3 text-gray-500">
        <svg class="w-8 h-8 animate-spin text-gray-400" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
            stroke="currentColor" stroke-width="4" fill="none"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>

        <p class="text-sm">
          Verifying session status...
        </p>
      </div>
    </ng-template>

  </main>

  <router-outlet></router-outlet>

</div>
