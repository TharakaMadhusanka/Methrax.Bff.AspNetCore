name: Publish NuGet Package

on:
  release:
    types: [published] # Triggers strictly when you publish an official GitHub Release

permissions:
  contents: read
  id-token: write # Required for OIDC / Trusted Publishing authentication with NuGet.org

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Aligned with .NET 10 target

      - name: Restore Dependencies
        run: dotnet restore Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.slnx

      - name: Build Project (Release)
        run: dotnet build Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.csproj --configuration Release

      - name: Pack Package
        run: >
          dotnet pack Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.csproj 
          --configuration Release 
          --no-build 
          --output ./artifacts

      - name: Push Package via Trusted Publishing
        run: >
          dotnet nuget push ./artifacts/*.nupkg 
          --source https://api.nuget.org/v3/index.json 
          --skip-duplicate
