name: Publish NuGet Package

on:
  release:
    types: [published] 

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.slnx

      - name: Build Project (Release)
        run: dotnet build Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.csproj --configuration Release

      - name: Pack Package
        run: >
          dotnet pack Src/Methrax.Bff.AspNetCore/Methrax.Bff.AspNetCore.csproj 
          --configuration Release 
          --no-build 
          --output ./artifacts

      - name: NuGet Login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: Push Package to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg 
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} 
          --source https://api.nuget.org/v3/index.json 
          --skip-duplicate
